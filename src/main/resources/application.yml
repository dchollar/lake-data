spring:
  application:
    name: lake-data

  web:
    error:
      include-message: never
      include-exception: false
      include-stacktrace: never

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pipe_lake?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:lake_data_app}
    password: ${DB_PASSWORD:Pa$$word8}
    hikari:
      pool-name: LakeDataHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      max-lifetime: 1800000 # 30 minutes
      connection-timeout: 30000 # 30 seconds
      idle-timeout: 600000 # 10 minutes

  jpa:
    open-in-view: true
    show-sql: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE

  threads:
    virtual:
      enabled: true

server:
  compression:
    enabled: true

ftp:
  upload-location: /home/lake-data-ftp/ftp/upload
  process-location: /home/lake-data-ftp/process
  archive-location: /home/lake-data-ftp/archive
  error-location: /home/lake-data-ftp/error