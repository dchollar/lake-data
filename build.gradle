plugins {
    id 'war'
    id 'groovy'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

springBoot {
    buildInfo()
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

ext {
    set('groovy.version', libs.versions.groovy.get())
}

dependencies {
    implementation(libs.groovy.all)
    // spring-jcl was removed in Spring Framework 7; jcl-over-slf4j bridges JCL → SLF4J for
    // any transitive dependencies (tess4j, pdfbox, POI, etc.) that use the commons-logging API
    implementation('org.slf4j:jcl-over-slf4j')

    implementation(libs.commons.lang3)
    implementation(libs.commons.io)
    implementation(libs.pdfbox)
    implementation(libs.tess4j)
    implementation(libs.poi.core)
    implementation(libs.poi.ooxml)
    implementation(libs.jsoup)

    implementation('org.springframework.boot:spring-boot-starter-webmvc')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('org.springframework.boot:spring-boot-starter-cache')
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
    implementation(libs.thymeleaf.extras.springsecurity6)

    // JTS is an optional transitive dep of hibernate-core, so it must be declared explicitly
    implementation(libs.jts.core)
    implementation('org.hibernate.validator:hibernate-validator')
    implementation('org.hibernate.orm:hibernate-spatial')

    implementation(libs.springdoc.openapi.ui)
    implementation(libs.springdoc.openapi.common)
    implementation(libs.mysql.connector.j)
    implementation('org.yaml:snakeyaml')

    annotationProcessor('org.springframework.boot:spring-boot-configuration-processor')
    providedRuntime('org.springframework.boot:spring-boot-starter-tomcat-runtime')

    testImplementation project()
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.spock.core
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
